<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelhano Sport's</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
padding-bottom:140px;
}

/* HEADER */

.header{
background:#111;
padding:14px;
border-bottom:2px solid #ea580c;
position:sticky;
top:0;
z-index:999;
text-align:center;
}

.logo{
font-size:24px;
font-weight:700;
color:#ea580c;
}

.sub{
font-size:12px;
color:#9ca3af;
margin-top:4px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:8px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:14px;
overflow:hidden;
padding:8px;
}

/* INFORMAÇÕES */
.info{
padding:0;
}

.nome{
font-size:13px;
font-weight:bold;
line-height:1.2;
margin-bottom:4px;

display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;

min-height:30px;
}

.preco{
font-size:22px;
font-weight:bold;
color:#22c55e;
margin-bottom:5px;
}

/* ESTOQUE PEQUENO */
.estoque-box{
display:flex;
flex-wrap:wrap;
gap:4px;
margin-bottom:6px;
}

.estoque-item{
background:#1f1f1f;
padding:3px 7px;
border-radius:20px;
font-size:10px;
white-space:nowrap;
}

/* SELECT MENOR */
select{
width:100%;
height:34px;
padding:0 8px;
border-radius:8px;
border:1px solid #333;
background:#1a1a1a;
color:#fff;
font-size:12px;
margin-bottom:6px;
}

/* BOTÃO MENOR */
button{
width:100%;
height:34px;
border:none;
border-radius:8px;
background:#ea580c;
color:#fff;
font-size:12px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#333;
}

/* CARRINHO */
.carrinho{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-top:2px solid #ea580c;
padding:10px;
max-height:180px;
overflow:auto;
z-index:999;
}

.finalizar{
height:40px;
background:#16a34a;
font-size:14px;
}

/* DESKTOP */
@media(min-width:768px){

.grid{
grid-template-columns:
repeat(auto-fill,minmax(180px,1fr));
max-width:1200px;
margin:auto;
}

.card img{
height:150px;
}

}
  /* BOTÃO FLUTUANTE */
.cart-float{
position:fixed;
right:18px;
bottom:20px;
width:60px;
height:60px;
background:#ea580c;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
cursor:pointer;
z-index:9999;
box-shadow:0 4px 15px rgba(0,0,0,.4);
}

.cart-float span{
position:absolute;
top:-4px;
right:-4px;
background:#16a34a;
width:24px;
height:24px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

/* FUNDO ESCURO */
.cart-overlay{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
transition:.3s;
z-index:99999;
display:flex;
justify-content:flex-end;
}

.cart-overlay.active{
right:0;
}

/* MENU LATERAL */
.cart-sidebar{
width:360px;
max-width:90%;
height:100%;
background:#111;
padding:20px;
display:flex;
flex-direction:column;
overflow:auto;
border-left:2px solid #ea580c;
}

.cart-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.cart-header h3{
font-size:22px;
}

.cart-header button{
width:40px;
height:40px;
border:none;
background:#222;
border-radius:10px;
color:#fff;
font-size:18px;
cursor:pointer;
}

.finalizar{
margin-top:auto;
height:48px;
background:#16a34a;
font-size:15px;
border:none;
border-radius:10px;
color:#fff;
font-weight:bold;
cursor:pointer;
}
 .foto-box{
position:relative;
width:100%;
height:150px;
background:#141414;
border-radius:12px;
overflow:hidden;
margin-bottom:8px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #222;
}

.produto-img{
width:100%;
height:100%;
object-fit:contain;
padding:8px;
transition:.2s;
}

.foto-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
width:32px;
height:32px;
border:none;
border-radius:50%;
background:rgba(0,0,0,.55);
backdrop-filter:blur(6px);
color:white;
font-size:18px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
z-index:10;
}

.foto-btn:hover{
background:#ea580c;
transform:
translateY(-50%) scale(1.08);
}

.foto-prev{
left:6px;
}

.foto-next{
right:6px;
}
  
.filtros{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px 8px;
background:#111;
border-bottom:1px solid #222;
}

.filtros::-webkit-scrollbar{
display:none;
}

.filtros button{
min-width:max-content;
padding:0 14px;
height:38px;
border:none;
border-radius:999px;
background:#1f1f1f;
color:#fff;
font-size:13px;
font-weight:600;
cursor:pointer;
transition:.2s;
white-space:nowrap;
}

.filtros button:hover{
background:#ea580c;
}

.filtros button.ativo{
background:#ea580c;
box-shadow:0 0 10px rgba(234,88,12,.35);
}
  
</style>
</head>

<body>

<div class="header">
<div class="logo">Castelhano Sport's</div>
<div class="sub">Represente seu time com estilo!</div>
</div>
<div class="filtros">

<button onclick="filtrar('Todos')">
Todos
</button>

<button onclick="filtrar('Europeias')">
Europeias
</button>

<button onclick="filtrar('Selecoes')">
Seleções
</button>

<button onclick="filtrar('Times BR')">
Times BR
</button>

<button onclick="filtrar('Selecao Brasileira')">
Seleção BR
</button>

</div>
  
<div class="grid" id="produtos"></div>

<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
apiKey:"AIzaSyD4TfY6Iwrju_aaG1vpN-q1Z9LyiDBeQvQ",
authDomain:"estoque-app-13f1d.firebaseapp.com",
projectId:"estoque-app-13f1d",
storageBucket:"estoque-app-13f1d.appspot.com",
messagingSenderId:"193095930583",
appId:"1:193095930583:web:88587ee9f4e10076619692"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtos = [];
let filtroAtual = 'Todos';
let carrinho = [];

async function carregar(){

const snap = await getDocs(
collection(db,'produtos')
);

produtos = [];

snap.forEach(doc => {
produtos.push({
id:doc.id,
...doc.data()
});
});
  
  render();

}
  
  window.filtrar = function(categoria){

filtroAtual = categoria;

render();

}
  
  carregar();
  
function render(){

const lista =
document.getElementById('produtos');

lista.innerHTML='';

produtos.forEach(produto=>{

if(
filtroAtual !== 'Todos' &&
produto.categoria !== filtroAtual
){
return;
}

let opcoes = '';
let estoqueTexto = '';
let disponivel = false;

if(produto.tamanhos){

for(let t in produto.tamanhos){

let d = produto.tamanhos[t];

let restante =
(d.total || 0) -
(d.vendido || 0);

estoqueTexto += `
<div class="estoque-item">
${t}: ${restante} disponível
</div>
`;

if(restante > 0){

disponivel = true;

opcoes += `
<option value="${t}">
${t} (${restante})
</option>
`;
}
}
}

const imagens =
produto.imagens?.length
? produto.imagens
: (
produto.img
? [produto.img]
: ['https://via.placeholder.com/300x300?text=Sem+Imagem']
);

lista.innerHTML += `
<div class="card"

<div
class="foto-box"
onclick="abrirProduto('${produto.id}')">

<img
id="foto-${produto.id}"
src="${imagens[0]}"
class="produto-img">

</div>

<div class="info">

<div class="nome">
${produto.nome || 'Sem nome'}
</div>

<div class="preco">
R$ ${produto.valor || 0}
</div>

<div class="estoque-box">
${estoqueTexto}
</div>

${disponivel ? `
<button
onclick="event.stopPropagation(); abrirProduto('${produto.id}')">
COMPRAR
</button>
` : `
<button disabled>
ESGOTADO
</button>
`}
</div>
</div>
`;

});

}

window.addCarrinho = function(id){

const produto =
produtos.find(p => p.id === id);

if(!produto){
alert('Produto não encontrado');
return;
}

const tamanho =
document.getElementById(
`tam-${id}`
)?.value;

if(!tamanho){
alert('Selecione um tamanho');
return;
}

const dadosTamanho =
produto.tamanhos[tamanho];

if(!dadosTamanho){
alert('Tamanho inválido');
return;
}

// estoque real
const estoqueDisponivel =
(dadosTamanho.total || 0) -
(dadosTamanho.vendido || 0);

// conta quantas desse tamanho já existem no carrinho
const quantidadeNoCarrinho =
carrinho
.filter(item =>
item.id === id &&
item.tamanho === tamanho
)
.reduce((acc,item)=>
acc + item.quantidade,0);

// BLOQUEIA SE PASSAR DO ESTOQUE
if(
quantidadeNoCarrinho >=
estoqueDisponivel
){

alert(
`Só existem ${estoqueDisponivel} unidade(s) do tamanho ${tamanho}`
);

return;
}

const imagem =
produto.imagens?.[0]
|| produto.img
|| '';

const itemExistente =
carrinho.find(item =>
item.id === id &&
item.tamanho === tamanho
);

if(itemExistente){

itemExistente.quantidade += 1;

}else{

carrinho.push({
id: produto.id,
nome: produto.nome,
tamanho,
valor: Number(produto.valor),
quantidade: 1,
imagem
});

}

atualizarCarrinho();

}
  
function atualizarCarrinho(){

const div =
document.getElementById(
'itensCarrinho'
);

const contador =
document.getElementById(
'cartCount'
);

let totalItens = 0;

if(carrinho.length === 0){

div.innerHTML =
'Carrinho vazio';

contador.innerText = 0;

return;
}

let total = 0;
let html = '';

carrinho.forEach((item,index)=>{

totalItens += item.quantidade;

const subtotal =
item.valor *
item.quantidade;

total += subtotal;

html += `
<div style="
margin-bottom:12px;
padding:12px;
background:#1a1a1a;
border-radius:14px;
text-align:center;
position:relative;
">

<button
onclick="removerItem(${index})"
style="
position:absolute;
top:10px;
right:10px;
width:34px;
height:34px;
border:none;
border-radius:50%;
background:#dc2626;
font-size:16px;
cursor:pointer;
">
🗑
</button>

<img src="${item.imagem}"
style="
width:100%;
height:140px;
object-fit:contain;
background:#111;
border-radius:12px;
padding:8px;
border:1px solid #333;
margin-bottom:10px;
">

<div style="
font-size:15px;
font-weight:bold;
margin-bottom:8px;
">
${item.nome}
</div>

<div style="
font-size:14px;
line-height:1.8;
color:#d1d5db;
">

📏 Tamanho:

<select
id="tamProduto"
onclick="event.stopPropagation()"
style="
width:100%;
height:48px;
margin-top:20px;
border-radius:12px;
background:#1a1a1a;
color:white;
border:1px solid #333;
padding:0 10px;
">

${Object.keys(
produtos.find(
p => p.id === item.id
)?.tamanhos || {}
).map(tam => {

const produto =
produtos.find(
p => p.id === item.id
);

const dados =
produto.tamanhos[tam];

const restante =
(dados.total || 0) -
(dados.vendido || 0);

return `
<option
value="${tam}"
${item.tamanho === tam
? 'selected'
: ''}

${restante <= 0
&& item.tamanho !== tam
? 'disabled'
: ''}>

${tam} (${restante})

</option>
`;

}).join('')}

</select>

💰 Valor:
R$ ${subtotal.toFixed(2)}

</div>

<div style="
display:flex;
justify-content:center;
align-items:center;
gap:12px;
margin-top:12px;
">

<button
onclick="alterarQtd(${index},-1)"
style="
width:42px;
height:42px;
border:none;
border-radius:50%;
background:#dc2626;
font-size:22px;
color:white;
cursor:pointer;
">
−
</button>

<div style="
font-size:20px;
font-weight:bold;
min-width:30px;
text-align:center;
">
${item.quantidade}
</div>

<button
onclick="alterarQtd(${index},1)"
style="
width:42px;
height:42px;
border:none;
border-radius:50%;
background:#16a34a;
font-size:22px;
color:white;
cursor:pointer;
">
+
</button>

</div>

</div>
`;

});

contador.innerText =
totalItens;

html += `
<h3 style="
margin-top:10px;
color:#22c55e;
text-align:center;
">
TOTAL:
R$ ${total.toFixed(2)}
</h3>
`;

div.innerHTML =
html;

}

/* REMOVER ITEM */

window.removerItem = function(index){

carrinho.splice(index,1);

atualizarCarrinho();

}

/* ALTERAR QUANTIDADE */

window.alterarQtd = function(index,valor){

const item =
carrinho[index];

const produto =
produtos.find(
p => p.id === item.id
);

if(!produto) return;

const dadosTamanho =
produto.tamanhos[item.tamanho];

const estoqueDisponivel =
(dadosTamanho.total || 0) -
(dadosTamanho.vendido || 0);

if(valor > 0){

if(item.quantidade >= estoqueDisponivel){

alert(
`Só existem ${estoqueDisponivel}
unidades disponíveis`
);

return;
}

item.quantidade++;

}else{

item.quantidade--;

if(item.quantidade <= 0){

carrinho.splice(index,1);

}

}

atualizarCarrinho();

};


/* ALTERAR TAMANHO */

window.alterarTamanho = function(index,novoTamanho){

const item =
carrinho[index];

const produto =
produtos.find(
p => p.id === item.id
);

if(!produto) return;

const dados =
produto.tamanhos[novoTamanho];

const estoqueDisponivel =
(dados.total || 0) -
(dados.vendido || 0);

if(item.quantidade > estoqueDisponivel){

alert(
`Esse tamanho possui apenas
${estoqueDisponivel}
unidades disponíveis`
);

item.quantidade =
Math.max(
1,
estoqueDisponivel
);

}

item.tamanho =
novoTamanho;

atualizarCarrinho();

};
  
window.finalizarPedido = async function(){

if(carrinho.length === 0){
alert('Carrinho vazio');
return;
}

try{

// BAIXA ESTOQUE NO FIREBASE
for(const item of carrinho){

const produto =
produtos.find(p => p.id === item.id);

if(!produto) continue;

const tamanho =
produto.tamanhos[item.tamanho];

if(!tamanho) continue;

// confere estoque real
const disponivel =
tamanho.total -
tamanho.vendido;

if(item.quantidade > disponivel){

alert(
`Estoque insuficiente para:
${produto.nome}
Tamanho ${item.tamanho}`
);

return;
}

// baixa quantidade vendida
tamanho.vendido +=
item.quantidade;

await updateDoc(
doc(db,'produtos',item.id),
{
tamanhos:
produto.tamanhos
}
);

}

// MONTA MENSAGEM WHATSAPP
let mensagem =
'🛒 *NOVO PEDIDO - CASTELHANO SPORTS*%0A%0A';

let total = 0;

carrinho.forEach((item,index)=>{

const subtotal =
item.valor *
item.quantidade;

total += subtotal;

mensagem +=
`*${index+1}. ${item.nome}*%0A` +
`📏 Tamanho: ${item.tamanho}%0A` +
`🔢 Quantidade: ${item.quantidade}%0A` +
`💰 Valor: R$ ${subtotal.toFixed(2)}%0A%0A`;

});

mensagem +=
`💵 *TOTAL: R$ ${total.toFixed(2)}*`;

// limpa carrinho
carrinho = [];
atualizarCarrinho();

// recarrega produtos
await carregar();

window.open(
`https://wa.me/5547991938901?text=${mensagem}`,
'_blank'
);

alert('Pedido enviado e estoque atualizado!');

}catch(e){

console.error(e);

alert(
'Erro ao finalizar pedido: ' +
e.message
);

}

}
  
/* ABRIR CARRINHO */

window.abrirCarrinho = function(){

document
.getElementById('cartOverlay')
.classList.add('active');

}

/* FECHAR */

window.fecharCarrinho = function(){

document
.getElementById('cartOverlay')
.classList.remove('active');

}
window.fotoAtual = {};

window.trocarFoto = function(id,direcao){

const produto =
produtos.find(p=>p.id===id);

if(!produto) return;

const imagens =
produto.imagens?.length
? produto.imagens
: (
produto.img
? [produto.img]
: ['https://via.placeholder.com/300x300?text=Sem+Imagem']
);

if(window.fotoAtual[id] == null){
window.fotoAtual[id] = 0;
}

window.fotoAtual[id] += direcao;

if(window.fotoAtual[id] < 0){
window.fotoAtual[id] =
imagens.length - 1;
}

if(window.fotoAtual[id] >= imagens.length){
window.fotoAtual[id] = 0;
}

document.getElementById(
`foto-${id}`
).src =
imagens[window.fotoAtual[id]];
}
  window.qtdProdutoSelecionada = {};

window.mudarQtdProduto = function(tamanho,valor){

if(!window.qtdProdutoSelecionada[tamanho]){
window.qtdProdutoSelecionada[tamanho] = 0;
}

const produto =
window.produtoAtual;

if(!produto) return;

const dados =
produto.tamanhos[tamanho];

const estoqueDisponivel =
(dados.total || 0) -
(dados.vendido || 0);

window.qtdProdutoSelecionada[tamanho] += valor;

if(
window.qtdProdutoSelecionada[tamanho] < 0
){
window.qtdProdutoSelecionada[tamanho] = 0;
}

if(
window.qtdProdutoSelecionada[tamanho] >
estoqueDisponivel
){
window.qtdProdutoSelecionada[tamanho] =
estoqueDisponivel;
}

document.getElementById(
`qtd-${tamanho}`
).innerText =
window.qtdProdutoSelecionada[tamanho];

}
  
  window.abrirProduto = function(id){

const produto =
produtos.find(
p => p.id === id
);

if(!produto) return;

const imagens =
produto.imagens?.length
? produto.imagens
: (
produto.img
? [produto.img]
: ['https://via.placeholder.com/500']
);

const ordemTamanhos = [
'PP','P','M','G','GG','XG','XGG'
];

let opcoes = '';

ordemTamanhos.forEach(t => {

const d = produto.tamanhos[t];

if(!d) return;

const restante =
(d.total || 0) -
(d.vendido || 0);

if(restante <= 0) return;

opcoes += `
<div style="
display:flex;
justify-content:space-between;
align-items:center;
background:#1a1a1a;
padding:12px;
border-radius:12px;
margin-bottom:10px;
">

<div style="
font-size:16px;
font-weight:bold;
">
${t}
<br>
<span style="
font-size:13px;
color:#9ca3af;
">
${restante} disponíveis
</span>
</div>

<div style="
display:flex;
align-items:center;
gap:10px;
">

<button
onclick="alterarQtdProduto('${t}',-1)"
style="
width:38px;
height:38px;
border-radius:50%;
background:#dc2626;
font-size:22px;
border:none;
color:white;
">
−
</button>

<div
id="qtd-${t}"
style="
min-width:30px;
text-align:center;
font-size:20px;
font-weight:bold;
">
0
</div>

<button
onclick="alterarQtdProduto('${t}',1,${restante})"
style="
width:38px;
height:38px;
border-radius:50%;
background:#16a34a;
font-size:22px;
border:none;
color:white;
">
+
</button>

</div>

</div>
`;
});
    
document.getElementById(
'produtoDetalhes'
).innerHTML = `

<div style="
background:#181818;
border-radius:20px;
padding:15px;
">

<div style="
position:relative;
height:360px;
background:#0f0f0f;
border-radius:20px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
">

<img
id="fotoProdutoModal"
src="${imagens[0]}"
style="

border:none;

color:white;
font-size:16px;

">
ADICIONAR AO CARRINHO
</button>
`;

window.imagensModal =
imagens;

window.indexModal = 0;

document.getElementById(
'produtoModal'
).style.display = 'block';

}

window.fecharProduto = function(){

document.getElementById(
'produtoModal'
).style.display = 'none';

}

window.trocarFotoModal = function(direcao){

window.indexModal += direcao;

if(
window.indexModal < 0
){
window.indexModal =
window.imagensModal.length - 1;
}

if(
window.indexModal >=
window.imagensModal.length
){
window.indexModal = 0;
}

document.getElementById(
'fotoProdutoModal'
).src =
window.imagensModal[
window.indexModal
];

}

window.addCarrinhoProduto =
function(id){

const produto =
produtos.find(
p => p.id === id
);

if(!produto) return;

let adicionou = false;

for(
let tamanho in
window.qtdProdutoSelecionada
){

const qtd =
window.qtdProdutoSelecionada[
tamanho
];

if(qtd <= 0) continue;

const imagem =
produto.imagens?.[0]
|| produto.img
|| '';

const existente =
carrinho.find(
i =>
i.id === produto.id &&
i.tamanho === tamanho
);

if(existente){

existente.quantidade += qtd;

}else{

carrinho.push({
id:produto.id,
nome:produto.nome,
tamanho,
valor:Number(produto.valor),
quantidade:qtd,
imagem
});

}

adicionou = true;
}

if(!adicionou){

alert(
'Selecione pelo menos um tamanho'
);

return;
}

window.qtdProdutoSelecionada = {};

atualizarCarrinho();

fecharProduto();

abrirCarrinho();

}
  
</script>
