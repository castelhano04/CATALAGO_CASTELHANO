<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelhano Sport's</title>

<style>
*{
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
padding-bottom:140px;
}

/* HEADER */

.header{
background:#111;
padding:14px;
border-bottom:2px solid #ea580c;
position:sticky;
top:0;
z-index:999;
text-align:center;
}

.logo{
font-size:24px;
font-weight:700;
color:#ea580c;
}

.sub{
font-size:12px;
color:#9ca3af;
margin-top:4px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:8px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:14px;
overflow:hidden;
padding:8px;
}

/* IMAGEM MENOR */
.card img{
width:100%;
height:110px;
object-fit:contain;
background:#181818;
border-radius:10px;
padding:4px;
margin-bottom:6px;
}

/* INFORMAÇÕES */
.info{
padding:0;
}

.nome{
font-size:13px;
font-weight:bold;
line-height:1.2;
margin-bottom:4px;

display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;

min-height:30px;
}

.preco{
font-size:22px;
font-weight:bold;
color:#22c55e;
margin-bottom:5px;
}

/* ESTOQUE PEQUENO */
.estoque-box{
display:flex;
flex-wrap:wrap;
gap:4px;
margin-bottom:6px;
}

.estoque-item{
background:#1f1f1f;
padding:3px 7px;
border-radius:20px;
font-size:10px;
white-space:nowrap;
}

/* SELECT MENOR */
select{
width:100%;
height:34px;
padding:0 8px;
border-radius:8px;
border:1px solid #333;
background:#1a1a1a;
color:#fff;
font-size:12px;
margin-bottom:6px;
}

/* BOTÃO MENOR */
button{
width:100%;
height:34px;
border:none;
border-radius:8px;
background:#ea580c;
color:#fff;
font-size:12px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#333;
}

/* CARRINHO */
.carrinho{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-top:2px solid #ea580c;
padding:10px;
max-height:180px;
overflow:auto;
z-index:999;
}

.finalizar{
height:40px;
background:#16a34a;
font-size:14px;
}

/* DESKTOP */
@media(min-width:768px){

.grid{
grid-template-columns:
repeat(auto-fill,minmax(180px,1fr));
max-width:1200px;
margin:auto;
}

.card img{
height:150px;
}

}
  
</style>
</head>

<body>

<div class="header">
<div class="logo">Castelhano Sport's</div>
<div class="sub">Represente seu time com estilo!</div>
</div>

<div class="grid" id="produtos"></div>

<div class="carrinho">
<div id="itensCarrinho">
Carrinho vazio
</div>

<button class="finalizar" onclick="finalizarPedido()">
FINALIZAR PEDIDO
</button>
</div>

<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
getFirestore,
collection,
getDocs
}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
apiKey:"AIzaSyD4TfY6Iwrju_aaG1vpN-q1Z9LyiDBeQvQ",
authDomain:"estoque-app-13f1d.firebaseapp.com",
projectId:"estoque-app-13f1d",
storageBucket:"estoque-app-13f1d.appspot.com",
messagingSenderId:"193095930583",
appId:"1:193095930583:web:88587ee9f4e10076619692"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtos = [];
let carrinho = [];

async function carregar(){

const snap = await getDocs(
collection(db,'produtos')
);

produtos = [];

snap.forEach(doc => {
produtos.push({
id:doc.id,
...doc.data()
});
});

render();

}

carregar();

function render(){

const lista =
document.getElementById('produtos');

lista.innerHTML='';

produtos.forEach(produto=>{

let opcoes = '';
let estoqueTexto = '';
let disponivel = false;

if(produto.tamanhos){

for(let t in produto.tamanhos){

let d = produto.tamanhos[t];

let restante =
(d.total || 0) -
(d.vendido || 0);

estoqueTexto += `
<div class="estoque-item">
${t}: ${restante} disponível
</div>
`;

if(restante > 0){

disponivel = true;

opcoes += `
<option value="${t}">
${t} (${restante})
</option>
`;

}
}
}

const imagem =
produto.imagens?.[0] ||
produto.img ||
'https://via.placeholder.com/300x300?text=Sem+Imagem';

lista.innerHTML += `
<div class="card">

<img src="${imagem}">

<div class="info">

<div class="nome">
${produto.nome || 'Sem nome'}
</div>

<div class="preco">
R$ ${produto.valor || 0}
</div>

<div class="estoque-box">
${estoqueTexto}
</div>

${disponivel ? `
<select id="tam-${produto.id}">
${opcoes}
</select>

<button onclick="addCarrinho('${produto.id}')">
ADICIONAR AO CARRINHO
</button>
` : `
<button disabled>
ESGOTADO
</button>
`}

</div>
</div>
`;

});

}

window.addCarrinho = function(id){

const produto =
produtos.find(p=>p.id===id);

const tamanho =
document.getElementById(
`tam-${id}`
)?.value || 'Único';

carrinho.push({
nome:produto.nome,
tamanho,
valor:Number(produto.valor),
quantidade:1
});

atualizarCarrinho();

}

function atualizarCarrinho(){

const div =
document.getElementById(
'itensCarrinho'
);

if(carrinho.length===0){
div.innerHTML='Carrinho vazio';
return;
}

let total = 0;
let html = '';

carrinho.forEach(item=>{

const subtotal =
item.valor * item.quantidade;

total += subtotal;

html += `
<div style="margin-bottom:10px;">
<b>${item.nome}</b><br>
Tam: ${item.tamanho}<br>
Qtd: ${item.quantidade}<br>
R$ ${subtotal.toFixed(2)}
</div>
`;

});

html += `
<b>TOTAL: R$ ${total.toFixed(2)}</b>
`;

div.innerHTML = html;

}

window.finalizarPedido = function(){

if(carrinho.length===0){
alert('Carrinho vazio');
return;
}

window.open(
'https://wa.me/5547991938901',
'_blank'
);

}

</script>

</body>
</html>
