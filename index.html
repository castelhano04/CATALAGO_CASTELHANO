<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelhano Sport's</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif
}

body{
background:#0f0f0f;
color:#fff;
padding-bottom:95px;
}

/* HEADER */
.header{
background:#111;
padding:14px;
border-bottom:2px solid #ea580c;
position:sticky;
top:0;
z-index:999;
}

.logo{
font-size:22px;
font-weight:bold;
color:#ea580c;
text-align:center;
}

.sub{
text-align:center;
font-size:11px;
color:#aaa;
margin-top:3px;
}

/* GRADE */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:8px;
}
  
.card{
  background:#111;
  border-radius:10px;
  overflow:hidden;
  border:1px solid #222;
  padding:6px;
}

.card img{
  width:100%;
  height:120px; /* menor */
  object-fit:contain; /* mostra a camisa inteira */
  border-radius:10px;
  display:block;
  background:#181818;
  padding:4px;
}

.info{
  padding:6px 2px;
}

.nome{
  font-size:14px;
  font-weight:bold;
  margin-bottom:4px;
  line-height:1.2;
  
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.preco{
  color:#22c55e;
  font-size:22px;
  font-weight:bold;
  margin-bottom:8px;
}

.estoque-item{
  background:#1f1f1f;
  padding:5px 8px;
  border-radius:8px;
  font-size:12px;
  margin-bottom:5px;
}

select{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:1px solid #333;
  background:#1a1a1a;
  color:white;
  font-size:13px;
  margin-top:5px;
}

button{
  width:100%;
  padding:11px;
  border:none;
  border-radius:10px;
  background:#ea580c;
  color:white;
  font-weight:bold;
  margin-top:8px;
  cursor:pointer;
  font-size:13px;
}

@media (min-width:768px){
  .grid{
    grid-template-columns:
    repeat(auto-fill,minmax(220px,1fr));
  }

  .card img{
    height:220px;
  }
}
</style>
</head>
<body>

<div class="header">
<div class="logo">Castelhano Sport's</div>
<div class="sub">Represente seu time com estilo!</div>
</div>

<div class="grid" id="produtos"></div>

<div class="carrinho">
<div id="itensCarrinho">Carrinho vazio</div>
<button class="finalizar" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
apiKey:'AIzaSyD4TfY6Iwrju_aaG1vpN-q1Z9LyiDBeQvQ',
authDomain:'estoque-app-13f1d.firebaseapp.com',
projectId:'estoque-app-13f1d',
storageBucket:'estoque-app-13f1d.firebasestorage.app',
messagingSenderId:'193095930583',
appId:'1:193095930583:web:88587ee9f4e10076619692'
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtos=[];
let carrinho=[];

async function carregar(){
 const snap = await getDocs(collection(db,'produtos'));
 produtos=[];
 snap.forEach(doc=>produtos.push({id:doc.id,...doc.data()}));
 render();
}

function render(){
 const lista=document.getElementById('produtos');
 lista.innerHTML='';

 produtos.forEach(produto=>{

  let opcoes='';
  let disponivel=false;
  let estoqueTexto='';

  for(let t in produto.tamanhos){

   let d=produto.tamanhos[t];
   let restante=d.total-d.vendido;

  estoqueTexto += `
<div class="estoque-item">
${t}: ${restante} disponível
</div>`;

   if(restante>0){
    disponivel=true;

    opcoes += `
    <option value="${t}">
    ${t} (${restante} disponíveis)
    </option>`;
   }
  }

  lista.innerHTML += `
  <div class="card">

   <img src="${produto.imagens?.[0] || produto.img}">

   <div class="info">

    <div class="nome">
    ${produto.nome}
    </div>

    <div class="preco">
    R$ ${produto.valor}
    </div>

    ${estoqueTexto}

    ${
      disponivel
      ?
      `
      <select id="tam-${produto.id}">
      ${opcoes}
      </select>

      <button onclick="addCarrinho('${produto.id}')">
      ADICIONAR AO CARRINHO
      </button>
      `
      :
      `
      <button class="esgotado">
ESGOTADO
</button>
      `
    }

   </div>
  </div>`;
 });
}
window.addCarrinho=function(id){
 const produto=produtos.find(p=>p.id===id);
 const tamanho=document.getElementById(`tam-${id}`).value;

 carrinho.push({nome:produto.nome,tamanho,valor:produto.valor});
 atualizarCarrinho();
}

function atualizarCarrinho(){
 const div=document.getElementById('itensCarrinho');

 if(carrinho.length===0){
  div.innerHTML='Carrinho vazio';
  return;
 }

 let total=0;
 let html='';

 carrinho.forEach(item=>{
  total += Number(item.valor);
  html += `• ${item.nome} - Tam ${item.tamanho} - R$ ${item.valor}<br>`;
 });

 html += `<br><b>Total: R$ ${total.toFixed(2)}</b>`;
 div.innerHTML=html;
}

window.finalizarPedido=function(){

 if(carrinho.length===0){
  alert('Carrinho vazio');
  return;
 }

 let msg='Olá! Tenho interesse nessas camisas:%0A%0A';

 let total=0;

 carrinho.forEach(item=>{

  total += Number(item.valor);

  msg += `🏆 ${item.nome}%0A`;
  msg += `📏 Tamanho: ${item.tamanho}%0A`;
  msg += `💰 Valor: R$ ${item.valor}%0A%0A`;

 });

 msg += `💵 Total do pedido: R$ ${total.toFixed(2)}`;

 window.open(
 `https://wa.me/5547991938901?text=${msg}`,
 '_blank'
 );
}

carregar();
</script>
</body>
</html>
