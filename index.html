<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelhano Sport's</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
padding-bottom:140px;
}

/* HEADER */

.header{
background:#111;
padding:14px;
border-bottom:2px solid #ea580c;
position:sticky;
top:0;
z-index:999;
text-align:center;
}

.logo{
font-size:24px;
font-weight:700;
color:#ea580c;
}

.sub{
font-size:12px;
color:#9ca3af;
margin-top:4px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:8px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:14px;
overflow:hidden;
padding:8px;
}

/* INFORMAÇÕES */
.info{
padding:0;
}

.nome{
font-size:13px;
font-weight:bold;
line-height:1.2;
margin-bottom:4px;

display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;

min-height:30px;
}

.preco{
font-size:22px;
font-weight:bold;
color:#22c55e;
margin-bottom:5px;
}

/* ESTOQUE PEQUENO */
.estoque-box{
display:flex;
flex-wrap:wrap;
gap:4px;
margin-bottom:6px;
}

.estoque-item{
background:#1f1f1f;
padding:3px 7px;
border-radius:20px;
font-size:10px;
white-space:nowrap;
}

/* SELECT MENOR */
select{
width:100%;
height:34px;
padding:0 8px;
border-radius:8px;
border:1px solid #333;
background:#1a1a1a;
color:#fff;
font-size:12px;
margin-bottom:6px;
}

/* BOTÃO MENOR */
button{
width:100%;
height:34px;
border:none;
border-radius:8px;
background:#ea580c;
color:#fff;
font-size:12px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#333;
}

/* CARRINHO */
.carrinho{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-top:2px solid #ea580c;
padding:10px;
max-height:180px;
overflow:auto;
z-index:999;
}

.finalizar{
height:40px;
background:#16a34a;
font-size:14px;
}

/* DESKTOP */
@media(min-width:768px){

.grid{
grid-template-columns:
repeat(auto-fill,minmax(180px,1fr));
max-width:1200px;
margin:auto;
}

.card img{
height:150px;
}

}
  /* BOTÃO FLUTUANTE */
.cart-float{
position:fixed;
right:18px;
bottom:20px;
width:60px;
height:60px;
background:#ea580c;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
cursor:pointer;
z-index:9999;
box-shadow:0 4px 15px rgba(0,0,0,.4);
}

.cart-float span{
position:absolute;
top:-4px;
right:-4px;
background:#16a34a;
width:24px;
height:24px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

/* FUNDO ESCURO */
.cart-overlay{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
transition:.3s;
z-index:99999;
display:flex;
justify-content:flex-end;
}

.cart-overlay.active{
right:0;
}

/* MENU LATERAL */
.cart-sidebar{
width:360px;
max-width:90%;
height:100%;
background:#111;
padding:20px;
display:flex;
flex-direction:column;
overflow:auto;
border-left:2px solid #ea580c;
}

.cart-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.cart-header h3{
font-size:22px;
}

.cart-header button{
width:40px;
height:40px;
border:none;
background:#222;
border-radius:10px;
color:#fff;
font-size:18px;
cursor:pointer;
}

.finalizar{
margin-top:auto;
height:48px;
background:#16a34a;
font-size:15px;
border:none;
border-radius:10px;
color:#fff;
font-weight:bold;
cursor:pointer;
}
 .foto-box{
position:relative;
width:100%;
height:150px;
background:#141414;
border-radius:12px;
overflow:hidden;
margin-bottom:8px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #222;
}

.produto-img{
width:100%;
height:100%;
object-fit:contain;
padding:8px;
transition:.2s;
}

.foto-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
width:32px;
height:32px;
border:none;
border-radius:50%;
background:rgba(0,0,0,.55);
backdrop-filter:blur(6px);
color:white;
font-size:18px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
z-index:10;
}

.foto-btn:hover{
background:#ea580c;
transform:
translateY(-50%) scale(1.08);
}

.foto-prev{
left:6px;
}

.foto-next{
right:6px;
}
  
.filtros{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px 8px;
background:#111;
border-bottom:1px solid #222;
}

.filtros::-webkit-scrollbar{
display:none;
}

.filtros button{
min-width:max-content;
padding:0 14px;
height:38px;
border:none;
border-radius:999px;
background:#1f1f1f;
color:#fff;
font-size:13px;
font-weight:600;
cursor:pointer;
transition:.2s;
white-space:nowrap;
}

.filtros button:hover{
background:#ea580c;
}

.filtros button.ativo{
background:#ea580c;
box-shadow:0 0 10px rgba(234,88,12,.35);
}
  
</style>
</head>

<body>

<div class="header">
<div class="logo">Castelhano Sport's</div>
<div class="sub">Represente seu time com estilo!</div>
</div>
<div class="filtros">

<button onclick="filtrar('Todos')">
Todos
</button>

<button onclick="filtrar('Europeias')">
Europeias
</button>

<button onclick="filtrar('Selecoes')">
Seleções
</button>

<button onclick="filtrar('Times BR')">
Times BR
</button>

<button onclick="filtrar('Selecao Brasileira')">
Seleção BR
</button>

</div>
  
<div class="grid" id="produtos"></div>

<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
getFirestore,
collection,
getDocs
}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
apiKey:"AIzaSyD4TfY6Iwrju_aaG1vpN-q1Z9LyiDBeQvQ",
authDomain:"estoque-app-13f1d.firebaseapp.com",
projectId:"estoque-app-13f1d",
storageBucket:"estoque-app-13f1d.appspot.com",
messagingSenderId:"193095930583",
appId:"1:193095930583:web:88587ee9f4e10076619692"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtos = [];
let filtroAtual = 'Todos';
let carrinho = [];

async function carregar(){

const snap = await getDocs(
collection(db,'produtos')
);

produtos = [];

snap.forEach(doc => {
produtos.push({
id:doc.id,
...doc.data()
});
});
  
  render();

}
  
  window.filtrar = function(categoria){

filtroAtual = categoria;

render();

}
  
  carregar();
  
function render(){

const lista =
document.getElementById('produtos');

lista.innerHTML='';

produtos
produtos
.filter(produto => {

if(filtroAtual === 'Todos'){
return true;
}

return produto.categoria === filtroAtual;

})
.forEach(produto=>{

if(
  filtroAtual !== 'Todos' &&
  produto.categoria !== filtroAtual
){
  return;
}

let opcoes = '';
let estoqueTexto = '';
let disponivel = false;

if(produto.tamanhos){

for(let t in produto.tamanhos){

let d = produto.tamanhos[t];

let restante =
(d.total || 0) -
(d.vendido || 0);

estoqueTexto += `
<div class="estoque-item">
${t}: ${restante} disponível
</div>
`;

if(restante > 0){

disponivel = true;

opcoes += `
<option value="${t}">
${t} (${restante})
</option>
`;

}
}
}

const imagens =
produto.imagens?.length
? produto.imagens
: (
produto.img
? [produto.img]
: ['https://via.placeholder.com/300x300?text=Sem+Imagem']
);
  
lista.innerHTML += `
<div class="card">

<div class="foto-box">

<img
id="foto-${produto.id}"
src="${imagens[0]}"
class="produto-img">

${
imagens.length > 1
? `
<button
class="foto-btn foto-prev"
onclick="trocarFoto('${produto.id}',-1)">
❮
</button>

<button
class="foto-btn foto-next"
onclick="trocarFoto('${produto.id}',1)">
❯
</button>
`
: ''
}

</div>

<div class="info">

<div class="nome">
${produto.nome || 'Sem nome'}
</div>

<div class="preco">
R$ ${produto.valor || 0}
</div>

<div class="estoque-box">
${estoqueTexto}
</div>

${disponivel ? `
<select id="tam-${produto.id}">
${opcoes}
</select>

<button onclick="addCarrinho('${produto.id}')">
ADICIONAR AO CARRINHO
</button>
` : `
<button disabled>
ESGOTADO
</button>
`}

</div>
</div>
`;

});

}

window.addCarrinho = function(id){

const produto =
produtos.find(p=>p.id===id);

const tamanho =
document.getElementById(
`tam-${id}`
)?.value || 'Único';

const imagem =
produto.imagens?.[0]
|| produto.img
|| '';

carrinho.push({
nome:produto.nome,
tamanho,
valor:Number(produto.valor),
quantidade:1,
imagem
});

atualizarCarrinho();

}

function atualizarCarrinho(){

const div =
document.getElementById(
'itensCarrinho'
);

const contador =
document.getElementById(
'cartCount'
);

let totalItens = 0;

if(carrinho.length===0){

div.innerHTML =
'Carrinho vazio';

contador.innerText = 0;

return;
}

let total = 0;
let html = '';

carrinho.forEach(item=>{

totalItens += item.quantidade;

const subtotal =
item.valor *
item.quantidade;

total += subtotal;

html += `
<div style="
margin-bottom:12px;
padding:10px;
background:#1a1a1a;
border-radius:12px;
display:flex;
gap:10px;
align-items:center;
">

<img src="${item.imagem}"
style="
width:70px;
height:70px;
object-fit:contain;
background:#111;
border-radius:10px;
padding:4px;
border:1px solid #333;
">

<div style="flex:1;">

<b>${item.nome}</b><br>

📏 Tam:
${item.tamanho}<br>

🔢 Qtd:
${item.quantidade}<br>

💰 R$
${subtotal.toFixed(2)}

</div>

</div>
`;

});

contador.innerText =
totalItens;

html += `
<h3 style="
margin-top:10px;
color:#22c55e;
">
TOTAL:
R$ ${total.toFixed(2)}
</h3>
`;

div.innerHTML =
html;

}

window.finalizarPedido = function(){

if(carrinho.length===0){
alert('Carrinho vazio');
return;
}

let mensagem =
'🛒 *NOVO PEDIDO - CASTELHANO SPORTS*%0A%0A';

let total = 0;

carrinho.forEach((item,index)=>{

const subtotal =
item.valor * item.quantidade;

total += subtotal;

mensagem +=
`*${index+1}. ${item.nome}*%0A` +
`📏 Tamanho: ${item.tamanho}%0A` +
`🔢 Quantidade: ${item.quantidade}%0A` +
`💰 Valor: R$ ${subtotal.toFixed(2)}%0A%0A`;

});

mensagem +=
`💵 *TOTAL: R$ ${total.toFixed(2)}*`;

window.open(
`https://wa.me/5547991938901?text=${mensagem}`,
'_blank'
);

}
  
/* ABRIR CARRINHO */

window.abrirCarrinho = function(){

document
.getElementById('cartOverlay')
.classList.add('active');

}

/* FECHAR */

window.fecharCarrinho = function(){

document
.getElementById('cartOverlay')
.classList.remove('active');

}
window.fotoAtual = {};

window.trocarFoto = function(id,direcao){

const produto =
produtos.find(p=>p.id===id);

if(!produto) return;

const imagens =
produto.imagens?.length
? produto.imagens
: (
produto.img
? [produto.img]
: ['https://via.placeholder.com/300x300?text=Sem+Imagem']
);

if(window.fotoAtual[id] == null){
window.fotoAtual[id] = 0;
}

window.fotoAtual[id] += direcao;

if(window.fotoAtual[id] < 0){
window.fotoAtual[id] =
imagens.length - 1;
}

if(window.fotoAtual[id] >= imagens.length){
window.fotoAtual[id] = 0;
}

document.getElementById(
`foto-${id}`
).src =
imagens[window.fotoAtual[id]];
}
  
</script>
  
<!-- BOTÃO CARRINHO -->
<div class="cart-float" onclick="abrirCarrinho()">

🛒

<span id="cartCount">
0
</span>

</div>

<!-- MODAL CARRINHO -->
<div class="cart-overlay" id="cartOverlay">

<div class="cart-sidebar">

<div class="cart-header">

<h3>Seu Carrinho</h3>

<button onclick="fecharCarrinho()">
✕
</button>

</div>

<div id="itensCarrinho">
Carrinho vazio
</div>

<button
class="finalizar"
onclick="finalizarPedido()">

FINALIZAR PEDIDO

</button>

</div>

</div>
  
</body>
</html>
