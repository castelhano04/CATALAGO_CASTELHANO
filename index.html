<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelhano Sport's</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0b0b0b;
color:#fff;
padding-bottom:140px;
}

/* HEADER */

.header{
background:#111;
padding:14px;
border-bottom:2px solid #ea580c;
position:sticky;
top:0;
z-index:999;
text-align:center;
}

.logo{
font-size:24px;
font-weight:700;
color:#ea580c;
}

.sub{
font-size:12px;
color:#9ca3af;
margin-top:4px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:8px;
padding:8px;
}

.card{
background:#111;
border:1px solid #222;
border-radius:14px;
overflow:hidden;
padding:8px;
}

/* INFORMAÇÕES */
.info{
padding:0;
}

.nome{
font-size:13px;
font-weight:bold;
line-height:1.2;
margin-bottom:4px;

display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;

min-height:30px;
}

.preco{
font-size:22px;
font-weight:bold;
color:#22c55e;
margin-bottom:5px;
}

/* ESTOQUE PEQUENO */
.estoque-box{
display:flex;
flex-wrap:wrap;
gap:4px;
margin-bottom:6px;
}

.estoque-item{
background:#1f1f1f;
padding:3px 7px;
border-radius:20px;
font-size:10px;
white-space:nowrap;
}

/* SELECT MENOR */
select{
width:100%;
height:34px;
padding:0 8px;
border-radius:8px;
border:1px solid #333;
background:#1a1a1a;
color:#fff;
font-size:12px;
margin-bottom:6px;
}

/* BOTÃO MENOR */
button{
width:100%;
height:34px;
border:none;
border-radius:8px;
background:#ea580c;
color:#fff;
font-size:12px;
font-weight:bold;
cursor:pointer;
}

button:disabled{
background:#333;
}

/* CARRINHO */
.carrinho{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
border-top:2px solid #ea580c;
padding:10px;
max-height:180px;
overflow:auto;
z-index:999;
}

.finalizar{
height:40px;
background:#16a34a;
font-size:14px;
}

/* DESKTOP */
@media(min-width:768px){

.grid{
grid-template-columns:
repeat(auto-fill,minmax(180px,1fr));
max-width:1200px;
margin:auto;
}

.card img{
height:150px;
}

}
  /* BOTÃO FLUTUANTE */
.cart-float{
position:fixed;
right:18px;
bottom:20px;
width:60px;
height:60px;
background:#ea580c;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:28px;
cursor:pointer;
z-index:9999;
box-shadow:0 4px 15px rgba(0,0,0,.4);
}

.cart-float span{
position:absolute;
top:-4px;
right:-4px;
background:#16a34a;
width:24px;
height:24px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:12px;
font-weight:bold;
}

/* FUNDO ESCURO */
.cart-overlay{
position:fixed;
top:0;
right:-100%;
width:100%;
height:100%;
background:rgba(0,0,0,.5);
transition:.3s;
z-index:99999;
display:flex;
justify-content:flex-end;
}

.cart-overlay.active{
right:0;
}

/* MENU LATERAL */
.cart-sidebar{
width:360px;
max-width:90%;
height:100%;
background:#111;
padding:20px;
display:flex;
flex-direction:column;
overflow:auto;
border-left:2px solid #ea580c;
}

.cart-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.cart-header h3{
font-size:22px;
}

.cart-header button{
width:40px;
height:40px;
border:none;
background:#222;
border-radius:10px;
color:#fff;
font-size:18px;
cursor:pointer;
}

.finalizar{
margin-top:auto;
height:48px;
background:#16a34a;
font-size:15px;
border:none;
border-radius:10px;
color:#fff;
font-weight:bold;
cursor:pointer;
}
 .foto-box{
position:relative;
width:100%;
height:150px;
background:#141414;
border-radius:12px;
overflow:hidden;
margin-bottom:8px;
display:flex;
align-items:center;
justify-content:center;
border:1px solid #222;
}

.produto-img{
width:100%;
height:100%;
object-fit:contain;
padding:8px;
transition:.2s;
}

.foto-btn{
position:absolute;
top:50%;
transform:translateY(-50%);
width:32px;
height:32px;
border:none;
border-radius:50%;
background:rgba(0,0,0,.55);
backdrop-filter:blur(6px);
color:white;
font-size:18px;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
transition:.2s;
z-index:10;
}

.foto-btn:hover{
background:#ea580c;
transform:
translateY(-50%) scale(1.08);
}

.foto-prev{
left:6px;
}

.foto-next{
right:6px;
}
  
.filtros{
display:flex;
gap:8px;
overflow-x:auto;
padding:10px 8px;
background:#111;
border-bottom:1px solid #222;
}

.filtros::-webkit-scrollbar{
display:none;
}

.filtros button{
min-width:max-content;
padding:0 14px;
height:38px;
border:none;
border-radius:999px;
background:#1f1f1f;
color:#fff;
font-size:13px;
font-weight:600;
cursor:pointer;
transition:.2s;
white-space:nowrap;
}

.filtros button:hover{
background:#ea580c;
}

.filtros button.ativo{
background:#ea580c;
box-shadow:0 0 10px rgba(234,88,12,.35);
}
  
</style>
</head>

<body>

<div class="header">
<div class="logo">Castelhano Sport's</div>
<div class="sub">Represente seu time com estilo!</div>
</div>
<div class="filtros">

<button onclick="filtrar('Todos', this)">
Todos
</button>

<button onclick="filtrar('Europeias', this)">
Europeias
</button>

<button onclick="filtrar('Selecoes', this)">
Seleções
</button>

<button onclick="filtrar('Times BR', this)">
Times BR
</button>

<button onclick="filtrar('Selecao Brasileira', this)">
Seleção BR
</button>

</div>
  
<div class="grid" id="produtos"></div>

<script type="module">

import { initializeApp }
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';

import {
getFirestore,
collection,
getDocs,
doc,
updateDoc
}
from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
apiKey:"AIzaSyD4TfY6Iwrju_aaG1vpN-q1Z9LyiDBeQvQ",
authDomain:"estoque-app-13f1d.firebaseapp.com",
projectId:"estoque-app-13f1d",
storageBucket:"estoque-app-13f1d.appspot.com",
messagingSenderId:"193095930583",
appId:"1:193095930583:web:88587ee9f4e10076619692"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtos = [];
let filtroAtual = 'Todos';
let carrinho = [];

async function carregar(){

const snap = await getDocs(
collection(db,'produtos')
);

produtos = [];

snap.forEach(doc => {
produtos.push({
id:doc.id,
...doc.data()
});
});
  
  render();

}
  
 window.filtrar = function(categoria, botao){

filtroAtual = categoria;

// remove ativo
document
.querySelectorAll('.filtros button')
.forEach(btn =>
btn.classList.remove('ativo')
);

// adiciona classe ativa
if(botao){
botao.classList.add('ativo');
}

render();

}

carregar();
  
function render(){

const lista =
document.getElementById('produtos');

lista.innerHTML='';

produtos.forEach(produto=>{

if(
filtroAtual !== 'Todos' &&
produto.categoria !== filtroAtual
){
return;
}

let opcoes = '';
let estoqueTexto = '';
let disponivel = false;

if(produto.tamanhos){

for(let t in produto.tamanhos){

let d = produto.tamanhos[t];

let restante =
(d.total || 0) -
(d.vendido || 0);

estoqueTexto += `
<div class="estoque-item">
${t}: ${restante} disponível
</div>
`;

if(restante > 0){

disponivel = true;

opcoes += `
<option value="${t}">
${t} (${restante})
</option>
`;
}
}
}

const imagens =
produto.imagens?.length
? produto.imagens
: (
produto.img
? [produto.img]
: ['https://via.placeholder.com/300x300?text=Sem+Imagem']
);

lista.innerHTML += `
<div class="card">

<div
class="foto-box"
onclick="abrirProduto('${produto.id}')">

<img
id="foto-${produto.id}"
src="${imagens[0]}"
class="produto-img">

</div>

<div class="info">

<div class="nome">
${produto.nome || 'Sem nome'}
</div>

<div class="preco">
R$ ${produto.valor || 0}
</div>

<div class="estoque-box">
${estoqueTexto}
</div>

${disponivel ? `
<button
onclick="event.stopPropagation(); abrirProduto('${produto.id}')">
COMPRAR
</button>
` : `
<button disabled>
ESGOTADO
</button>
`}
</div>
</div>
`;

});

}
 
function atualizarCarrinho(){

const div =
document.getElementById('itensCarrinho');

const contador =
document.getElementById('cartCount');

let totalItens = 0;

if(carrinho.length === 0){

div.innerHTML = 'Carrinho vazio';
contador.innerText = 0;

return;
}

let total = 0;
let html = '';

const produtosAgrupados = {};

carrinho.forEach((item,index)=>{

if(!produtosAgrupados[item.id]){

produtosAgrupados[item.id] = {
nome:item.nome,
imagem:item.imagem,
id:item.id,
valor:item.valor,
itens:[]
};

}

produtosAgrupados[item.id]
.itens.push({
...item,
indexOriginal:index
});

});

Object.values(produtosAgrupados)
.forEach(produto=>{

let totalProduto = 0;
let tamanhosHTML = '';

produto.itens.forEach(item=>{

totalItens += item.quantidade;

const subtotal =
item.valor * item.quantidade;

total += subtotal;
totalProduto += subtotal;

tamanhosHTML += `
<div style="
display:flex;
justify-content:space-between;
align-items:center;
padding:8px 0;
border-bottom:1px solid #222;
gap:10px;
">

<div>
<div style="
font-size:16px;
font-weight:bold;
">
${item.tamanho}
</div>

<div style="
font-size:13px;
color:#fff;
">
${item.quantidade} peça${item.quantidade > 1 ? 's' : ''}
</div>
</div>

<div style="
display:flex;
align-items:center;
gap:8px;
">

<button
onclick="alterarQtdCarrinho(${item.indexOriginal}, -1)"
style="
width:34px;
height:34px;
border:none;
border-radius:10px;
background:#222;
color:#fff;
font-size:22px;
font-weight:bold;
cursor:pointer;
padding:0;
">
−
</button>

<button
onclick="alterarQtdCarrinho(${item.indexOriginal}, 1)"
style="
width:34px;
height:34px;
border:none;
border-radius:10px;
background:#2563eb;
color:white;
font-size:20px;
font-weight:bold;
cursor:pointer;
padding:0;
">
+
</button>

</div>

</div>
`;
  
});

html += `
<div style="
margin-bottom:12px;
padding:12px;
background:#1a1a1a;
border-radius:18px;
border:1px solid #2a2a2a;
display:flex;
gap:12px;
">

<img
src="${produto.imagem}"
style="
width:90px;
height:90px;
border-radius:14px;
object-fit:contain;
background:#111;
padding:6px;
flex-shrink:0;
">

<div style="
flex:1;
min-width:0;
">

<div style="
font-size:16px;
font-weight:bold;
margin-bottom:4px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
">
${produto.nome}
</div>

<div style="
font-size:20px;
font-weight:bold;
color:#22c55e;
margin-bottom:8px;
">
R$ ${totalProduto.toFixed(2)}
</div>

${tamanhosHTML}

</div>

</div>
`;

});

html += `
<div style="
margin-top:18px;
padding-top:18px;
border-top:1px solid #222;
display:flex;
justify-content:space-between;
align-items:center;
font-size:22px;
font-weight:bold;
">
<span style="color:#9ca3af">
Subtotal
</span>

<span style="color:#22c55e">
R$ ${total.toFixed(2)}
</span>
</div>
`;

div.innerHTML = html;
contador.innerText = totalItens;

}
/* REMOVER ITEM */

window.removerItem = function(index){

carrinho.splice(index,1);

atualizarCarrinho();

}

/* ALTERAR QUANTIDADE */

window.alterarQtd = function(index,valor){

const item =
carrinho[index];

const produto =
produtos.find(
p => p.id === item.id
);

if(!produto) return;

const dadosTamanho =
produto.tamanhos[item.tamanho];

const estoqueDisponivel =
(dadosTamanho.total || 0) -
(dadosTamanho.vendido || 0);

if(valor > 0){

if(item.quantidade >= estoqueDisponivel){

alert(
`Só existem ${estoqueDisponivel}
unidades disponíveis`
);

return;
}

item.quantidade++;

}else{

item.quantidade--;

if(item.quantidade <= 0){

carrinho.splice(index,1);

}

}

atualizarCarrinho();

};


/* ALTERAR TAMANHO */

window.alterarTamanho = function(index,novoTamanho){

const item =
carrinho[index];

const produto =
produtos.find(
p => p.id === item.id
);

if(!produto) return;

const dados =
produto.tamanhos[novoTamanho];

const estoqueDisponivel =
(dados.total || 0) -
(dados.vendido || 0);

if(item.quantidade > estoqueDisponivel){

alert(
`Esse tamanho possui apenas
${estoqueDisponivel}
unidades disponíveis`
);

item.quantidade =
Math.max(
1,
estoqueDisponivel
);

}

item.tamanho =
novoTamanho;

atualizarCarrinho();

};
  
window.finalizarPedido = async function(){

if(carrinho.length === 0){
alert('Carrinho vazio');
return;
}

try{

// BAIXA ESTOQUE NO FIREBASE
for(const item of carrinho){

const produto =
produtos.find(p => p.id === item.id);

if(!produto) continue;

const tamanho =
produto.tamanhos[item.tamanho];

if(!tamanho) continue;

// confere estoque real
const disponivel =
tamanho.total -
tamanho.vendido;

if(item.quantidade > disponivel){

alert(
`Estoque insuficiente para:
${produto.nome}
Tamanho ${item.tamanho}`
);

return;
}

// baixa quantidade vendida
tamanho.vendido +=
item.quantidade;

await updateDoc(
doc(db,'produtos',item.id),
{
tamanhos:
produto.tamanhos
}
);

}

// MONTA MENSAGEM WHATSAPP
let mensagem =
'🛒 *NOVO PEDIDO - CASTELHANO SPORTS*%0A%0A';

let total = 0;

carrinho.forEach((item,index)=>{

const subtotal =
item.valor *
item.quantidade;

total += subtotal;

mensagem +=
`*${index+1}. ${item.nome}*%0A` +
`📏 Tamanho: ${item.tamanho}%0A` +
`🔢 Quantidade: ${item.quantidade}%0A` +
`💰 Valor: R$ ${subtotal.toFixed(2)}%0A%0A`;

});

mensagem +=
`💵 *TOTAL: R$ ${total.toFixed(2)}*`;

// limpa carrinho
carrinho = [];
atualizarCarrinho();

// recarrega produtos
await carregar();

window.open(
`https://wa.me/5547991938901?text=${mensagem}`,
'_blank'
);

alert('Pedido enviado e estoque atualizado!');

}catch(e){

console.error(e);

alert(
'Erro ao finalizar pedido: ' +
e.message
);

}

}
  
/* ABRIR CARRINHO */

window.abrirCarrinho = function(){

document
.getElementById('cartOverlay')
.classList.add('active');

}

/* FECHAR */

window.fecharCarrinho = function(){

document
.getElementById('cartOverlay')
.classList.remove('active');

}
window.fotoAtual = {};

window.trocarFoto = function(id,direcao){

const produto =
produtos.find(p=>p.id===id);

if(!produto) return;

const imagens =
produto.imagens?.length
? produto.imagens
: (
produto.img
? [produto.img]
: ['https://via.placeholder.com/300x300?text=Sem+Imagem']
);

if(window.fotoAtual[id] == null){
window.fotoAtual[id] = 0;
}

window.fotoAtual[id] += direcao;

if(window.fotoAtual[id] < 0){
window.fotoAtual[id] =
imagens.length - 1;
}

if(window.fotoAtual[id] >= imagens.length){
window.fotoAtual[id] = 0;
}

document.getElementById(
`foto-${id}`
).src =
imagens[window.fotoAtual[id]];
}
window.qtdProdutoSelecionada = {};

window.alterarQtdProduto =
function(tamanho,valor,maximo){

if(
!window.qtdProdutoSelecionada[
tamanho
]
){
window.qtdProdutoSelecionada[
tamanho
] = 0;
}

let atual =
window.qtdProdutoSelecionada[
tamanho
];

atual += valor;

if(atual < 0){
atual = 0;
}

if(atual > maximo){
atual = maximo;
}

window.qtdProdutoSelecionada[
tamanho
] = atual;

document.getElementById(
`qtd-${tamanho}`
).innerText = atual;

}
  
window.abrirProduto = function(id){

window.qtdProdutoSelecionada = {};

const produto =
produtos.find(p => p.id === id);

if(!produto) return;

const imagens =
produto.imagens?.length
? produto.imagens
: (
produto.img
? [produto.img]
: ['https://via.placeholder.com/500']
);

const ordemTamanhos = [
'PP','P','M','G','GG','XG','XGG'
];

let opcoes = '';

ordemTamanhos.forEach(t => {

const d = produto.tamanhos?.[t];

if(!d) return;

const restante =
(d.total || 0) -
(d.vendido || 0);

if(restante <= 0) return;

opcoes += `
<div style="
display:flex;
justify-content:space-between;
align-items:center;
background:#fff;
padding:12px 14px;
border-radius:14px;
border:1px solid #e8e8e8;
margin-bottom:8px;
min-height:68px;
">

<div>
<div style="
font-size:18px;
font-weight:700;
color:#111;
line-height:1;
">
${t}
</div>

<div style="
font-size:12px;
color:#777;
margin-top:4px;
">
${restante} disponíveis
</div>
</div>

<div style="
display:flex;
align-items:center;
gap:12px;
">

<button
onclick="alterarQtdProduto('${t}',-1,${restante})"
style="
width:34px;
height:34px;
border-radius:10px;
border:1px solid #ddd;
background:#f8f8f8;
font-size:20px;
font-weight:bold;
color:#111;
cursor:pointer;
padding:0;
">
−
</button>

<div
id="qtd-${t}"
style="
font-size:22px;
font-weight:700;
min-width:22px;
text-align:center;
color:#111;
">
0
</div>

<button
onclick="alterarQtdProduto('${t}',1,${restante})"
style="
width:34px;
height:34px;
border-radius:10px;
border:none;
background:#ea580c;
font-size:20px;
font-weight:bold;
color:white;
cursor:pointer;
padding:0;
">
+
</button>

</div>
</div>
`;

}); // FECHAMENTO CERTO

document.getElementById(
'produtoDetalhes'
).innerHTML = `

<div style="
background:#f5f5f5;
border-radius:40px 40px 0 0;
overflow:hidden;
min-height:100vh;
color:#111;
">

<!-- FOTO -->
<div style="
position:relative;
height:280px;
background:#111;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
">

<img
id="fotoProdutoModal"
src="${imagens[0]}"
style="
width:100%;
height:100%;
object-fit:contain;
">

${
imagens.length > 1
? `
<button
onclick="trocarFotoModal(-1)"
style="
position:absolute;
left:15px;
top:50%;
transform:translateY(-50%);
width:48px;
height:48px;
border:none;
border-radius:50%;
background:#00000070;
color:white;
font-size:24px;
cursor:pointer;
">
❮
</button>

<button
onclick="trocarFotoModal(1)"
style="
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
width:48px;
height:48px;
border:none;
border-radius:50%;
background:#00000070;
color:white;
font-size:24px;
cursor:pointer;
">
❯
</button>
`
: ''
}

<button
onclick="fecharProduto()"
style="
position:absolute;
top:18px;
right:18px;
background:none;
border:none;
padding:0;
color:white;
font-size:32px;
font-weight:300;
cursor:pointer;
width:auto;

">

">
ADICIONAR AO CARRINHO
</button>

</div>

`;

window.imagensModal = imagens;
window.indexModal = 0;

document.getElementById(
'produtoModal'
).style.display = 'block';

};

window.fecharProduto = function(){

document.getElementById(
'produtoModal'
).style.display = 'none';

}

window.trocarFotoModal = function(direcao){

window.indexModal += direcao;

if(
window.indexModal < 0
){
window.indexModal =
window.imagensModal.length - 1;
}

if(
window.indexModal >=
window.imagensModal.length
){
window.indexModal = 0;
}

document.getElementById(
'fotoProdutoModal'
).src =
window.imagensModal[
window.indexModal
];

}

window.salvarProdutoCarrinho = function(id){

const produto =
produtos.find(p => p.id === id);

if(!produto) return;

if(window.itemEditando !== null){

carrinho.splice(
window.itemEditando,
1
);

window.itemEditando = null;
}

let adicionou = false;

for(let tamanho in window.qtdProdutoSelecionada){

const qtd =
window.qtdProdutoSelecionada[tamanho];

if(qtd <= 0) continue;

const imagem =
produto.imagens?.[0]
|| produto.img
|| '';

const existente =
carrinho.find(i =>
i.id === produto.id &&
i.tamanho === tamanho
);

if(existente){

existente.quantidade += qtd;

}else{

carrinho.push({
id:produto.id,
nome:produto.nome,
tamanho,
valor:Number(produto.valor),
quantidade:qtd,
imagem
});

}

adicionou = true;
}

if(!adicionou){
alert('Selecione pelo menos um tamanho');
return;
}

window.qtdProdutoSelecionada = {};

atualizarCarrinho();

fecharProduto();

abrirCarrinho();

};

window.editarItemCarrinho = function(index){

const item = carrinho[index];

if(!item) return;

window.itemEditando = index;

abrirProduto(item.id);

setTimeout(()=>{

window.qtdProdutoSelecionada = {};

window.qtdProdutoSelecionada[
item.tamanho
] = item.quantidade;

const el =
document.getElementById(
`qtd-${item.tamanho}`
);

if(el){
el.innerText =
item.quantidade;
}

},100);

};
  
 window.alterarQtdCarrinho = function(index, valor){

const item = carrinho[index];

if(!item) return;

const produto =
produtos.find(
p => p.id === item.id
);

if(!produto) return;

const dadosTamanho =
produto.tamanhos[item.tamanho];

if(!dadosTamanho) return;

const estoqueDisponivel =
(dadosTamanho.total || 0) -
(dadosTamanho.vendido || 0);

// ADICIONAR
if(valor > 0){

if(item.quantidade >= estoqueDisponivel){

alert('Estoque insuficiente');

return;
}

item.quantidade++;

}

// REMOVER
else{

item.quantidade--;

if(item.quantidade <= 0){

carrinho.splice(index,1);

}

}

atualizarCarrinho();

};
  
</script>
