<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Castelhano Sport's</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif
}

body{
background:#0f0f0f;
color:#fff;
padding-bottom:120px;
}

/* HEADER */
.header{
background:#111;
padding:18px;
border-bottom:2px solid #ea580c;
position:sticky;
top:0;
z-index:99;
}

.logo{
font-size:30px;
font-weight:bold;
color:#ea580c;
text-align:center;
}

.sub{
text-align:center;
color:#aaa;
font-size:13px;
margin-top:4px;
}

/* GRID IGUAL LOJA */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;
padding:14px;
}

/* CARD */
.card{
background:transparent;
border:none;
overflow:hidden;
}

/* FOTO PRODUTO */
.card img{
width:100%;
height:190px;
object-fit:cover;
border-radius:18px;
display:block;
background:#1a1a1a;
}

/* INFO */
.info{
padding:8px 2px;
}

/* NOME */
.nome{
font-size:15px;
font-weight:600;
line-height:1.2;
margin-top:8px;
margin-bottom:6px;

display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
min-height:38px;
}

/* PREÇO */
.preco{
color:#22c55e;
font-size:24px;
font-weight:bold;
margin-bottom:8px;
}

/* ESTOQUE */
.estoque-box{
background:#1b1b1b;
padding:8px;
border-radius:10px;
font-size:13px;
margin-bottom:6px;
}

/* SELECT */
select{
width:100%;
height:42px;
border:none;
border-radius:12px;
background:#1f1f1f;
color:#fff;
padding:0 10px;
margin-top:8px;
margin-bottom:8px;
font-size:14px;
}

/* BOTÃO */
button{
width:100%;
height:46px;
border:none;
border-radius:14px;
background:#ea0000;
color:#fff;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

/* ESGOTADO */
.esgotado{
background:#555 !important;
cursor:not-allowed;
}

/* CARRINHO */
.carrinho{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
border-top:2px solid #ea580c;
padding:15px;
z-index:999;
}

#itensCarrinho{
font-size:13px;
color:#ddd;
margin-bottom:10px;
max-height:90px;
overflow:auto;
}

.finalizar{
background:#22c55e;
font-size:18px;
}

/* RESPONSIVO */
@media(max-width:600px){

.logo{
font-size:22px;
}

.grid{
gap:12px;
padding:12px;
}

.card img{
height:170px;
}

.nome{
font-size:14px;
min-height:34px;
}

.preco{
font-size:21px;
}

button{
height:44px;
font-size:14px;
}
}
</style>
</head>
<body>

<div class="header">
<div class="logo">Castelhano Sport's</div>
<div class="sub">Represente seu time com estilo!</div>
</div>

<div class="grid" id="produtos"></div>

<div class="carrinho">
<div id="itensCarrinho">Carrinho vazio</div>
<button class="finalizar" onclick="finalizarPedido()">FINALIZAR PEDIDO</button>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
apiKey:'AIzaSyD4TfY6Iwrju_aaG1vpN-q1Z9LyiDBeQvQ',
authDomain:'estoque-app-13f1d.firebaseapp.com',
projectId:'estoque-app-13f1d',
storageBucket:'estoque-app-13f1d.firebasestorage.app',
messagingSenderId:'193095930583',
appId:'1:193095930583:web:88587ee9f4e10076619692'
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let produtos=[];
let carrinho=[];

async function carregar(){
 const snap = await getDocs(collection(db,'produtos'));
 produtos=[];
 snap.forEach(doc=>produtos.push({id:doc.id,...doc.data()}));
 render();
}

function render(){
 const lista=document.getElementById('produtos');
 lista.innerHTML='';

 produtos.forEach(produto=>{

  let opcoes='';
  let disponivel=false;
  let estoqueTexto='';

  for(let t in produto.tamanhos){

   let d=produto.tamanhos[t];
   let restante=d.total-d.vendido;

   estoqueTexto += `
  <div class="estoque-box">
   background:#1f1f1f;
   padding:8px;
   border-radius:8px;
   margin-bottom:6px">
   ${t}: ${restante} disponível
   </div>`;

   if(restante>0){
    disponivel=true;

    opcoes += `
    <option value="${t}">
    ${t} (${restante} disponíveis)
    </option>`;
   }
  }

  lista.innerHTML += `
  <div class="card">

   <img src="${produto.imagens?.[0] || produto.img}">

   <div class="info">

    <div class="nome">
    ${produto.nome}
    </div>

    <div class="preco">
    R$ ${produto.valor}
    </div>

    ${estoqueTexto}

    ${
      disponivel
      ?
      `
      <select id="tam-${produto.id}">
      ${opcoes}
      </select>

      <button onclick="addCarrinho('${produto.id}')">
      ADICIONAR AO CARRINHO
      </button>
      `
      :
      `
      <button class="esgotado">
ESGOTADO
</button>
      `
    }

   </div>
  </div>`;
 });
}
window.addCarrinho=function(id){
 const produto=produtos.find(p=>p.id===id);
 const tamanho=document.getElementById(`tam-${id}`).value;

 carrinho.push({nome:produto.nome,tamanho,valor:produto.valor});
 atualizarCarrinho();
}

function atualizarCarrinho(){
 const div=document.getElementById('itensCarrinho');

 if(carrinho.length===0){
  div.innerHTML='Carrinho vazio';
  return;
 }

 let total=0;
 let html='';

 carrinho.forEach(item=>{
  total += Number(item.valor);
  html += `• ${item.nome} - Tam ${item.tamanho} - R$ ${item.valor}<br>`;
 });

 html += `<br><b>Total: R$ ${total.toFixed(2)}</b>`;
 div.innerHTML=html;
}

window.finalizarPedido=function(){

 if(carrinho.length===0){
  alert('Carrinho vazio');
  return;
 }

 let msg='Olá! Tenho interesse nessas camisas:%0A%0A';

 let total=0;

 carrinho.forEach(item=>{

  total += Number(item.valor);

  msg += `🏆 ${item.nome}%0A`;
  msg += `📏 Tamanho: ${item.tamanho}%0A`;
  msg += `💰 Valor: R$ ${item.valor}%0A%0A`;

 });

 msg += `💵 Total do pedido: R$ ${total.toFixed(2)}`;

 window.open(
 `https://wa.me/5547991938901?text=${msg}`,
 '_blank'
 );
}

carregar();
</script>
</body>
</html>
